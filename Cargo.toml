[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Local iteration build: same optimisation level as `release`, but without
# thin LTO and with parallel codegen and incremental reuse. Ship builds still
# use `release`. `cargo build --profile release-fast`.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# `cargo bench` (`just bench`): release optimisation with the fast-compile
# settings of release-fast, so the perf gate does not pay for thin LTO.
[profile.bench]
lto = false
codegen-units = 16
incremental = true

# Lints that only generate noise in this codebase. Each is allowed on purpose:
# too_many_arguments / type_complexity flag the renderer plumbing that the P3
# workspace split restructures; field_reassign_with_default and
# needless_range_loop are style-only and their rewrites read worse in the
# SoA-style loops here. Everything else is denied by `just clippy`.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
field_reassign_with_default = "allow"
needless_range_loop = "allow"
# App-state and library-result enums are built once per session; boxing their
# large variants adds indirection for no measurable gain.
large_enum_variant = "allow"
