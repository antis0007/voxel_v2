<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mod Parity</title>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/devtools-qol.css"><link rel="stylesheet" href="/forge-shell.css"><link rel="stylesheet" href="/parity.css">
<script type="module" src="/parity-ui.mjs"></script></head>
<body class="forge-page">
<main class="parity">
  <section class="coverage" aria-label="Coverage by family">
    <div class="coverage-head">
      <h1>Mod parity</h1>
      <p id="totals" class="coverage-totals" role="status">Loading ledger…</p>
      <div class="legend" id="legend" aria-label="Status colours"></div>
      <button id="coverage-toggle" class="ghost" aria-expanded="true" title="Hide the coverage map">Hide map</button>
    </div>
    <div id="lanes" class="lanes"></div>
  </section>
  <div class="workbench">
    <aside class="rail" aria-label="Filters">
      <input id="query" type="search" placeholder="Search rows  /" aria-label="Search ID, label or mapping">
      <div class="rail-block"><h2>Family</h2><div id="families" class="facet"></div></div>
      <div class="rail-block"><h2>Status</h2><div id="statuses" class="facet"></div></div>
      <div class="rail-block"><h2>Milestone</h2><div id="milestones" class="facet facet-inline"></div></div>
      <div class="rail-block"><h2>Owner systems</h2>
        <div class="segmented" id="readiness" role="radiogroup" aria-label="Owner readiness">
          <button data-ready="" role="radio">Any</button><button data-ready="ready" role="radio" title="Every owner system already has code to build on">Ready</button><button data-ready="waiting" role="radio" title="An owner system is still design-only">Waiting</button>
        </div>
      </div>
      <button id="reset" class="ghost">Clear filters</button>
      <p class="rail-foot">Rows come from the feature matrix. Agents use <code>parity-cli.mjs</code>; see PARITY.md.</p>
    </aside>
    <section class="results" aria-label="Feature rows">
      <div class="results-bar">
        <span id="count" class="results-count"></span>
        <div class="segmented" id="view" role="radiogroup" aria-label="Layout">
          <button data-view="list" role="radio">List</button><button data-view="board" role="radio">Board</button>
        </div>
        <label class="inline">Group <select id="group"><option value="section">Section</option><option value="family">Family</option><option value="status">Status</option><option value="milestone">Milestone</option><option value="none">None</option></select></label>
        <label class="inline">Sort <select id="sort"><option value="id">ID</option><option value="milestone">Milestone</option><option value="risk">Fewest risks</option><option value="status">Status</option></select></label>
      </div>
      <div id="rows" class="rows"></div>
    </section>
    <aside id="detail" class="detail" aria-label="Selected row" tabindex="-1"></aside>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body></html>
