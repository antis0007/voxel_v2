# World generation: terrain, biomes, trees, sites, dungeons, valleys, the
# undercrown plan. Pure functions of WorldSampleConfig; no runtime state.
[package]
name = "engine_worldgen"
version.workspace = true
edition.workspace = true

[dependencies]
engine_core = { path = "../core" }
engine_content = { path = "../content" }
engine_voxel = { path = "../voxel" }
anyhow = "1"
sha2 = "0.10.9"
glam = "0.34.2"

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# Criterion benches: `just bench`; baselines in benches/baselines.json.
[[bench]]
name = "terrain"
harness = false
