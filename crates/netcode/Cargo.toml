# Transport-independent multiplayer logic: link impairment, snapshot
# interpolation, pose quantisation. No sockets and no game state, so every
# piece runs in plain unit tests (docs/superpowers/specs/2026-10-26-multiplayer-design.md).
[package]
name = "engine_netcode"
version.workspace = true
edition.workspace = true

[dependencies]
engine_core = { path = "../core" }
glam = "0.34.2"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "netcode"
harness = false

[lints]
workspace = true
