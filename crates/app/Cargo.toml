# The game binary: window, input, UI, main loop, and (until Phase 4 splits
# them out) the world hub with physics, factory and adventure.
[package]
name = "minecraft_style_voxel_prototype"
version.workspace = true
edition.workspace = true

[features]
default = ["multiplayer"]
# Lobby sessions through the relay need no native library.
multiplayer = []
# Direct GameNetworkingSockets addresses. Needs the native library and libclang.
multiplayer-steam = ["multiplayer", "engine_net/steam"]
multiplayer-sdr = ["multiplayer", "engine_net/steamworks"]

[dependencies]
engine_tools = { path = "../tools" }
engine_net = { path = "../net" }
engine_netcode = { path = "../netcode" }
engine_core = { path = "../core" }
engine_gpu = { path = "../gpu" }
engine_space = { path = "../space" }
engine_content = { path = "../content" }
engine_audio = { path = "../audio" }
engine_voxel = { path = "../voxel" }
engine_worldgen = { path = "../worldgen" }
engine_sim = { path = "../sim" }
engine_sim_gpu = { path = "../sim_gpu" }
engine_chip = { path = "../chip" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
glam = { version = "0.34.2", features = ["serde"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
pollster = "1.0.1"
wgpu = "30.0.1"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-winit = "0.37.0"
egui-wgpu = "0.37.0"
winit = "0.30.13"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ron = "0.12.2"
gilrs = "0.11.2"
# Share miniz_oxide 0.8 with the PNG decoder.
flate2 = "=1.1.9"
getrandom = "0.3.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_vendor = "apple")))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["std"] }

[build-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

[dev-dependencies]
insta = "1.49.0"

[lints]
workspace = true
