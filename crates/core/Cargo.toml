# Leaf crate: hashing, voxel scale, coordinate math and simulation time
# budgets. Depends on nothing in the workspace.
[package]
name = "engine_core"
version.workspace = true
edition.workspace = true

[dependencies]
glam = "0.32.0"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "cube_sphere"
harness = false

[lints]
workspace = true
