# The cellular kernel's block rule on the GPU (docs/PLAN2.md A5): a WGSL port that must match
# engine_sim's CPU reference byte for byte. Kept out of engine_sim, which depends on engine_core only.
[package]
name = "engine_sim_gpu"
version.workspace = true
edition.workspace = true

[dependencies]
engine_core = { path = "../core" }
engine_sim = { path = "../sim" }
wgpu = "27.0.1"
bytemuck = "1"
glam = "0.32.0"

[dev-dependencies]
engine_content = { path = "../content" }
engine_gpu = { path = "../gpu" }
naga = { version = "27.0.3", features = ["wgsl-in"] }
pollster = "0.4.0"

[lints]
workspace = true
